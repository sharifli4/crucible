<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crucible</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header>
      <span id="title">⚔ CRUCIBLE</span>
      <span id="phase-label">Waiting for debate…</span>
      <span id="task-label"></span>
    </header>

    <main>
      <!-- Arena: agent cards + SVG attack arrows -->
      <div id="arena">
        <svg id="arrows" xmlns="http://www.w3.org/2000/svg">
          <defs id="arrow-defs"></defs>
        </svg>
        <div id="agents"></div>
        <div id="round-badge"></div>
        <div id="convergence-overlay"></div>
      </div>

      <!-- Side panel: speech bubble + event log -->
      <aside id="panel">
        <div id="speech-box">
          <div id="speech-header">
            <span id="speech-from"></span>
            <span id="speech-tag"></span>
          </div>
          <div id="speech-content">Open the browser, then run <code>/crucible</code> in Claude Code.</div>
        </div>
        <div id="log">
          <div id="log-title">LOG</div>
          <div id="log-entries"></div>
        </div>
      </aside>
    </main>

  </div>
  <script src="client.js"></script>
</body>
</html>
